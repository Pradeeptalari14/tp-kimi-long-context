apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kimi-k1-5-serving
  namespace: ai-serving
  labels:
    app: kimi-long-context
spec:
  serviceName: "kimi-k1-5"
  replicas: 1
  selector:
    matchLabels:
      app: kimi-long-context
  template:
    metadata:
      labels:
        app: kimi-long-context
    spec:
      containers:
        - name: kimi-engine
          image: ghcr.io/pradeeptalari14/kimi-long-context:latest
          command: ["python3", "kimi_serving_gateway.py"]
          resources:
            limits:
              nvidia.com/gpu: "8"
              memory: 128Gi
              cpu: "32"
            requests:
              nvidia.com/gpu: "8"
              memory: 64Gi
              cpu: "16"
          volumeMounts:
            - name: nvme-kv-cache
              mountPath: /mnt/nvme/kimi_kv_cache
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: nvme-kv-cache
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "local-nvme-sc"
        resources:
          requests:
            storage: 2Ti
---
apiVersion: v1
kind: Service
metadata:
  name: kimi-service
  namespace: ai-serving
spec:
  selector:
    app: kimi-long-context
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
